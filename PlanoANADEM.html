<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Proposta ANADEM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h2 {
      margin-bottom: 10px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      height: 420px;
      margin-top: 20px;
      padding: 10px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

<h2>Gerador de Proposta Personalizada – ANADEM</h2>

<label>Grupo / Especialidade</label>
<input id="p1" placeholder="Ex: D1 – Odontologia">

<label>Valor da Apólice / Capital Segurado</label>
<input id="p2" placeholder="Ex: R$ 1.000.000">

<label>Cartão – Tabela Verde</label>
<input id="p3" placeholder="Ex: R$ 189,00">

<label>Boleto – Tabela Verde</label>
<input id="p4" placeholder="Ex: R$ 199,00">

<label>Cartão – Tabela Black</label>
<input id="p5" placeholder="Ex: R$ 239,00">

<label>Boleto – Tabela Black</label>
<input id="p6" placeholder="Ex: R$ 249,00">

<button onclick="gerarTexto()">Gerar texto</button>

<textarea id="resultado" placeholder="O texto final aparecerá aqui..."></textarea>

<script>
function gerarTexto() {
  const p1 = document.getElementById("p1").value;
  const p2 = document.getElementById("p2").value;
  const p3 = document.getElementById("p3").value;
  const p4 = document.getElementById("p4").value;
  const p5 = document.getElementById("p5").value;
  const p6 = document.getElementById("p6").value;

  const texto = 
`🔒 *Proposta Personalizada – ANADEM*
_Proteção Jurídica Completa para Profissionais da Saúde_

Doutor(a), pensando na sua especialidade (${p1}), a ANADEM possui uma proposta sob medida para garantir sua tranquilidade profissional em um cenário de crescente judicialização.

Hoje, qualquer procedimento pode virar um processo — mesmo quando tudo é feito corretamente.

💼 Opções de Cobertura | Capital Segurado: ${p2}

🔹 *Sem Retroatividade*
💳 Cartão: ${p3}/mês
📄 Boleto: ${p4}/mês

🔹 *Com Retroatividade de 5 anos* (mais recomendada)
💳 Cartão: ${p5}/mês
📄 Boleto: ${p6}/mês

👉 _A retroatividade protege também atos já realizados nos últimos 5 anos._

⭐ *Por que a ANADEM é diferente de um seguro comum?*

✔ Atuação jurídica preventiva e defesa completa  
✔ Advogados especializados em Direito Médico e defesa nas esferas Cível, Criminal, Administrativa e Ética (CRO/CFO/CRM/CFM)  
✔ Plantão jurídico 24h, inclusive para dúvidas e orientações — não apenas em processos  
✔ Número ilimitado de processos, sem franquia e sem sublimites  
✔ Cobertura nacional, com renovação automática  

🛡️ *Diferencial exclusivo ANADEM*

✅ Gerenciamento de crise de imagem e reputação on-line  
Proteção no Google, redes sociais e mídias sociais — algo que nenhum seguro tradicional oferece.

✅ Extensão gratuita para CNPJ, quando houver (consultório ou PJ de faturamento, com um sócio da área da saúde).

⚠️ *Importante*

Processos estão cada vez mais comuns e a defesa correta desde o início faz toda a diferença — tanto financeiramente quanto na sua reputação profissional.

Se quiser, podemos ativar sua proteção ainda hoje e te explico como funciona, sem compromisso.

Fico à disposição.`;

  document.getElementById("resultado").value = texto;
}
</script>

</body>
</html>

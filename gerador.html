<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Proposta | OASIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f8; margin: 0; padding: 0; }
    .container { max-width: 900px; margin: auto; background: #ffffff; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-radius: 12px; margin-top: 40px; margin-bottom: 40px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { max-width: 220px; }
    h1 { text-align: center; margin-bottom: 10px; }
    p.subtitle { text-align: center; color: #555; margin-bottom: 30px; }
    label { font-weight: bold; margin-top: 15px; display: block; }
    input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; color: #fff; font-weight: bold; transition: 0.3s; }
    .btn-gerar { background: #0f766e; grid-column: span 2; }
    .btn-copiar { background: #2563eb; }
    .btn-pdf { background: #1e40af; }
    .btn-limpar { background: #6b7280; grid-column: span 2; }
    button:hover { opacity: 0.9; }
    textarea { width: 100%; height: 350px; margin-top: 20px; padding: 15px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; resize: vertical; box-sizing: border-box; }
    footer { text-align: center; font-size: 13px; color: #777; margin-top: 25px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="logo-oasisturdf.png" alt="Oasis Tour DF">
    </div>

    <h1>Gerador de Proposta ANADEM</h1>
    <p class="subtitle">Ferramenta Comercial • GRUPO OASIS DF</p>

    <label>Nome do Médico(a)</label>
    <input id="pNome" placeholder="Ex: Dr. Fulano de Tal">

    <label>Telefone / WhatsApp</label>
    <input id="pTel" placeholder="Ex: (61) 99999-9999">

    <label>Grupo / Especialidade</label>
    <input id="p1" placeholder="Ex: D1 – Odontologia">

    <label>Capital Segurado</label>
    <input id="p2" placeholder="Ex: 500.000,00">

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Verde</label>
        <input id="p3" placeholder="R$ 189,00">
      </div>
      <div style="flex: 1;">
        <label>Boleto – Tabela Verde</label>
        <input id="p4" placeholder="R$ 199,00">
      </div>
    </div>

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Black</label>
        <input id="p5" placeholder="R$ 239,00">
      </div>
      <div style="flex: 1;">
        <label>Boleto – Tabela Black</label>
        <input id="p6" placeholder="R$ 249,00">
      </div>
    </div>

    <div class="grid-btns">
        <button class="btn-gerar" onclick="gerarTexto()">1. Gerar Texto Original</button>
        <button class="btn-copiar" onclick="copiarTexto()">2. Copiar p/ WhatsApp</button>
        <button class="btn-pdf" onclick="gerarPDF()">3. Gerar PDF Preenchido</button>
        <button class="btn-limpar" onclick="limparCampos()">Limpar Formulário</button>
    </div>

    <textarea id="resultado" placeholder="O texto original será gerado aqui..."></textarea>

    <footer>© OASIS TOUR DF</footer>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>
function gerarTexto() {
  const nome = document.getElementById("pNome").value || "Doutor(a)";
  const tel = document.getElementById("pTel").value || "Não informado";
  const p1 = document.getElementById("p1").value;
  const p2 = document.getElementById("p2").value;
  const p3 = document.getElementById("p3").value;
  const p4 = document.getElementById("p4").value;
  const p5 = document.getElementById("p5").value;
  const p6 = document.getElementById("p6").value;

  const texto = 
`Prezado(a) Dr. ${nome},
Contato: ${tel}

Segue detalhamento conforme conversamos:

Diferenciais ANADEM:
• A retroatividade protege também, atos já realizados nos últimos 5 anos (conforme rege o regulamento).
• Atuação jurídica preventiva e defesa completa, com advogado indicado e custeado pela ANADEM — sem desembolso inicial e sem reembolso posterior.
• Suporte jurídico especializado para qualquer situação relacionada à sua atividade profissional, 24h por dia.
• Processos ilimitados, sem franquia para Plano Pessoa Física.
• Cobertura nacional.

Vantagens Exclusivas:
• Gerenciamento de crise de imagem e reputação on-line.
• Proteção no Google, redes sociais e mídias digitais.
• Extensão gratuita para o CNPJ (desde que para fins de faturamento, sem leito/internação e que haja somente um sócio da área da saúde no contrato social).

Fico à disposição para ativar sua proteção hoje mesmo!`;

  document.getElementById("resultado").value = texto;
}

function copiarTexto() {
  const campo = document.getElementById("resultado");
  if (!campo.value) return;
  campo.select();
  document.execCommand("copy");
  alert("Copiado.");
}

function limparCampos() {
  ["pNome","pTel","p1","p2","p3","p4","p5","p6","resultado"].forEach(id => document.getElementById(id).value = "");
}

async function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  const nomeMed = document.getElementById("pNome").value || "---";
  const telMed = document.getElementById("pTel").value || "---";
  const p1 = document.getElementById("p1").value || "---";
  const p2 = document.getElementById("p2").value || "---";
  const p3 = document.getElementById("p3").value || "---";
  const p4 = document.getElementById("p4").value || "---";
  const p5 = document.getElementById("p5").value || "---";
  const p6 = document.getElementById("p6").value || "---";

  doc.setFillColor(30, 64, 175);
  doc.rect(0, 0, 210, 38, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(22);
  doc.setFont('Helvetica', 'Bold');
  doc.text('PROPOSTA COMERCIAL ANADEM', 105, 18, { align: 'center' });
  doc.setFontSize(14);
  doc.text('Blindagem Profissional ANADEM', 105, 30, { align: 'center' });

  doc.setTextColor(0, 0, 0);
  doc.setFontSize(11);
  doc.setFont('Helvetica', 'Bold');
  doc.text(`Doutor(a): ${nomeMed}`, 15, 48);
  doc.text(`Contato: ${telMed}`, 15, 54);
  doc.text(`Especialidade: ${p1}`, 15, 60);
  doc.setFontSize(12);
  doc.text(`Capital Segurado*: R$ ${p2}`, 15, 67);

  doc.autoTable({
    startY: 74,
    head: [['Modalidade de Cobertura', 'Cartão de Crédito Mensal', 'Boleto Bancário Mensal']],
    body: [
      ['Tabela Verde (Sem Retroatividade)', `R$ ${p3}`, `R$ ${p4}`],
      ['Tabela Black (Retroatividade 5 anos)', `R$ ${p5}`, `R$ ${p6}`]
    ],
    theme: 'grid',
    headStyles: { fillColor: [30, 64, 175], fontSize: 11 },
    styles: { fontSize: 10.5, halign: 'center', cellPadding: 4 }
  });

  let y = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(12);
  doc.setFont('Helvetica', 'Bold');
  doc.text('Diferenciais e Vantagens Exclusivas:', 15, y);
  
    doc.setFontSize(11); 
  doc.setFont('Helvetica', 'Normal');
  
  const diferenciais = [
    "1. Assistência jurídica especializada em Direito Médico e Odontológico, nas áreas Criminal, Cível, Administrativa e Ética - CRM/CFM e CRO/CFO, por meio de renomados escritórios de advocacia credenciados em todo o território nacional.",
    " ",
    "2. Plantão permanente para esclarecer dúvidas, encaminhar o cliente ao escritório de advocacia credenciado a Anadem e oferecer suporte em caso de recebimento de intimação, notificação ou citação em âmbito judicial ou extrajudicial.",
    " ",
    "3. Ressarcimento de atos médicos/odontológicos praticados após a data de deferimento da adesão. Na contratação pela Tabela Black, haverá cobertura retroativa de 5 (cinco) anos para o ato profissional. Caso a pessoa física tenha apólice de seguro de Responsabilidade Civil Profissional vigente em Sociedade Seguradora, será mantida a data da retroatividade de cobertura dessa referida apólice, sem cobrança de contribuição adicional, limitada a 5 (cinco) anos, e desde que não tenha havido qualquer interrupção de vigência de seguro. Em ambos os casos, a retroatividade para o ato profissional será contada, e somente haverá cobertura para o processo protocolizado a partir do deferimento da adesão na condição de cliente.",

    "4. Indenização financeira de até R$ 1.000.000,00 (um milhão de reais), de acordo com o plano contratado*.",
    " ",
    "5. Cobertura para danos corporais, materiais, morais, estéticos e existenciais.",

    "6. Cobertura de honorários de peritos e de assistente técnicos.",

    "7. Gerenciamento de Crise de Imagem",

    "8. Sem sub-limitação de cobertura",

    "9. Sem limite de processos",

    "10. Antecipação de Tutela",

    "11. Sem denunciação à lide",

    "12. Renovação automática",

    "13. Cobertura Nacional",

    "14. Sem limite de cobertura (Plano pessoa física)."
  ];

  y += 7;
  diferenciais.forEach(item => {
    let lines = doc.splitTextToSize(item, 180);
    doc.text(lines, 15, y);
    y += (lines.length * 4.9); // Espaçamento entre linhas aumentado para preencher
  });

  // Assinatura (Posicionada no final da página)
  doc.setFontSize(11);
  doc.setFont('Helvetica', 'Bold');
  doc.text('Higo Gerson C. de Amorim', 105, 275, { align: 'center' });
  doc.setFont('Helvetica', 'Normal');
  doc.text('Representante Comercial Autorizado', 105, 281, { align: 'center' });
  doc.text('Grupo OASIS - DF', 105, 287, { align: 'center' });

  doc.save(`Orcamento_ANADEM_${nomeMed.replace(/\s+/g, '_')}.pdf`);
}
</script>
</body>
</html>

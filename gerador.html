<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Proposta | OASIS DF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f8; margin: 0; padding: 0; }
    .container { max-width: 900px; margin: auto; background: #ffffff; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-radius: 12px; margin-top: 40px; margin-bottom: 40px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { max-width: 220px; }
    h1 { text-align: center; margin-bottom: 10px; }
    p.subtitle { text-align: center; color: #555; margin-bottom: 30px; }
    label { font-weight: bold; margin-top: 15px; display: block; }
    input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; color: #fff; font-weight: bold; transition: 0.3s; }
    .btn-gerar { background: #0f766e; grid-column: span 2; }
    .btn-copiar { background: #2563eb; }
    .btn-limpar { background: #6b7280; grid-column: span 2; }
    button:hover { opacity: 0.9; }
    textarea { width: 100%; height: 350px; margin-top: 20px; padding: 15px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; resize: vertical; box-sizing: border-box; }
    footer { text-align: center; font-size: 13px; color: #777; margin-top: 25px; }
    .btn-orcamento { background: #9333ea; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="logo-oasisturdf.png" alt="Oasis Tour DF">
    </div>

    <h1>GERADOR DE PROPOSTAS</h1>
    <p class="subtitle">Ferramenta Comercial • GRUPO OASIS DF</p>

    <label>Nome do Médico(a)</label>
    <input id="pNome" placeholder="Ex: Dr. Fulano de Tal">

    <label>Telefone / WhatsApp</label>
    <input id="pTel" placeholder="Ex: (61) 99999-9999">

    <label>Grupo / Especialidade</label>
    <input id="p1" placeholder="Ex: D1 – Odontologia">

    <label>Capital Segurado</label>
    <input id="p2" placeholder="Ex: 500.000,00">

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Blue (Somente Medicina)</label>
        <input id="p7" placeholder="R$ 159,00">
      </div>
      <div style="flex: 1;"></div>
    </div>

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Verde</label>
        <input id="p3" placeholder="R$ 189,00">
      </div>
      <div style="flex: 1;">
        <label>Boleto – Tabela Verde</label>
        <input id="p4" placeholder="R$ 199,00">
      </div>
    </div>

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Black</label>
        <input id="p5" placeholder="R$ 239,00">
      </div>
      <div style="flex: 1;">
        <label>Boleto – Tabela Black</label>
        <input id="p6" placeholder="R$ 249,00">
      </div>
    </div>

    <div>
      <label>Desconto da Campanha (%)</label>
      <input id="desconto" type="number" min="0" max="100" step="0.01" placeholder="Ex: 10">
    </div>

    <div class="grid-btns">
      <button class="btn-gerar" onclick="gerarTexto()">1. Gerar Texto Original</button>
      <button class="btn-copiar" onclick="copiarTexto()">2. Copiar p/ WhatsApp</button>
      <button class="btn-orcamento" onclick="abrirOrcamento()">3. Gerar Orçamento</button>
      <button class="btn-limpar" onclick="limparCampos()">Limpar Formulário</button>
    </div>

    <textarea id="resultado" placeholder="O texto original será gerado aqui..."></textarea>
    <footer>© GRUPO OASIS DF</footer>
  </div>

<script>
function valorNumerico(valor) {
    if (!valor) return 0;
    return parseFloat(
        String(valor)
            .replace(/\s/g, "")
            .replace("R$", "")
            .replace(/\./g, "")
            .replace(",", ".")
    ) || 0;
}

function gerarTexto() {
  const nome = document.getElementById("pNome").value || "Doutor(a)";
  const p1 = document.getElementById("p1").value || "Sua Especialidade";
  const p2 = document.getElementById("p2").value || "500.000,00";
  const p3 = document.getElementById("p3").value || "VALOR CARTÃO";
  const p5 = document.getElementById("p5").value || "VALOR CARTÃO";
  const desconto = parseFloat(document.getElementById("desconto").value) || 0;
  const fatorDesconto = 1 - (desconto / 100);

  const mensalBlack = valorNumerico(p5) * fatorDesconto;
  const mensalVerde = valorNumerico(p3) * fatorDesconto;
  const boletoBlack = valorNumerico(document.getElementById("p6").value) * fatorDesconto;

  const mensalBlackFormatado = mensalBlack.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const boletoBlackFormatado = boletoBlack.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const mensalVerdeFormatado = mensalVerde.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const texto = `Dr. ${nome}, estruturei sua proposta de _Blindagem Profissional_ para _*${p1}*_.

🛡️ *Recomendação*: Retroatividade de 5 anos + ${p2} de cobertura.
⚖️ Assessoria jurídica | 💵 Despesas cobertas | 🌐 Proteção profissional e reputação digital

💰 *Investimento mensal:* R$ ${mensalBlackFormatado} no Cartão ou R$ ${boletoBlackFormatado} no Boleto.
> Importante: _Demandas já existentes ou em andamento não possuem cobertura._

📎 A proposta completa está em anexo.

Podemos alinhar os detalhes da adesão em uma ligação rápida de 3 minutos?`;

  document.getElementById("resultado").value = texto;
}

function copiarTexto() {
  const campo = document.getElementById("resultado");
  if (!campo.value) return;
  campo.select();
  document.execCommand("copy");
  alert("Copiado com sucesso!");
}

function limparCampos() {
  ["pNome","pTel","p1","p2","p3","p4","p5","p6","p7","resultado"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = "";
  });
}

function abrirOrcamento() {
  const nome = document.getElementById("pNome").value;
  const tel = document.getElementById("pTel").value;
  const p1 = document.getElementById("p1").value;
  const p2 = document.getElementById("p2").value;
  const p3 = document.getElementById("p3").value;
  const p4 = document.getElementById("p4").value;
  const p5 = document.getElementById("p5").value;
  const p6 = document.getElementById("p6").value;
  const p7 = document.getElementById("p7").value;

  const desconto = parseFloat(document.getElementById("desconto").value) || 0;
  const fatorDesconto = 1 - (desconto / 100);

  const vP3 = valorNumerico(p3) * fatorDesconto; 
  const vP4 = valorNumerico(p4) * fatorDesconto; 
  const vP5 = valorNumerico(p5) * fatorDesconto; 
  const vP6 = valorNumerico(p6) * fatorDesconto; 
  const vP7 = valorNumerico(p7) * fatorDesconto; 

  // Função auxiliar para calcular parcelas
  const calcParc = (val, n) => (val * 12) / n;
  const calcVista = (val) => (val * 12) * 0.90;

  const url =
    `ORCAMENTO_ANADEM.html?nome=${encodeURIComponent(nome)}` +
    `&tel=${encodeURIComponent(tel)}` +
    `&p1=${encodeURIComponent(p1)}` +
    `&p2=${encodeURIComponent(p2)}` +
    `&p3=${encodeURIComponent(vP3)}` +
    `&p3_2x=${encodeURIComponent(calcParc(vP3, 2))}&p3_4x=${encodeURIComponent(calcParc(vP3, 4))}&p3_6x=${encodeURIComponent(calcParc(vP3, 6))}&p3_8x=${encodeURIComponent(calcParc(vP3, 8))}&p3_10x=${encodeURIComponent(calcParc(vP3, 10))}&p3avista=${encodeURIComponent(calcVista(vP3))}` +
    `&p4=${encodeURIComponent(vP4)}` +
    `&p4_2x=${encodeURIComponent(calcParc(vP4, 2))}&p4_4x=${encodeURIComponent(calcParc(vP4, 4))}&p4_6x=${encodeURIComponent(calcParc(vP4, 6))}&p4_8x=${encodeURIComponent(calcParc(vP4, 8))}&p4_10x=${encodeURIComponent(calcParc(vP4, 10))}&p4avista=${encodeURIComponent(calcVista(vP4))}` +
    `&p5=${encodeURIComponent(vP5)}` +
    `&p5_2x=${encodeURIComponent(calcParc(vP5, 2))}&p5_4x=${encodeURIComponent(calcParc(vP5, 4))}&p5_6x=${encodeURIComponent(calcParc(vP5, 6))}&p5_8x=${encodeURIComponent(calcParc(vP5, 8))}&p5_10x=${encodeURIComponent(calcParc(vP5, 10))}&p5avista=${encodeURIComponent(calcVista(vP5))}` +
    `&p6=${encodeURIComponent(vP6)}` +
    `&p6_2x=${encodeURIComponent(calcParc(vP6, 2))}&p6_4x=${encodeURIComponent(calcParc(vP6, 4))}&p6_6x=${encodeURIComponent(calcParc(vP6, 6))}&p6_8x=${encodeURIComponent(calcParc(vP6, 8))}&p6_10x=${encodeURIComponent(calcParc(vP6, 10))}&p6avista=${encodeURIComponent(calcVista(vP6))}` +
    `&p7=${encodeURIComponent(vP7)}` +
    `&desconto=${encodeURIComponent(desconto)}`;

  const popup = window.open(
    url,
    "orcamentoAnadem",
    "width=1100,height=850,resizable=yes,scrollbars=yes"
  );

  if (!popup) {
    alert("O navegador bloqueou a pop-up. Autorize pop-ups para este site e tente novamente.");
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Proposta | OASIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f4f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border-radius: 12px;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      max-width: 220px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }

    .btn-gerar { background: #0f766e; }
    .btn-gerar:hover { background: #115e59; }

    .btn-copiar { background: #2563eb; }
    .btn-copiar:hover { background: #1e40af; }

    .btn-limpar { background: #6b7280; }
    .btn-limpar:hover { background: #4b5563; }

    .btn-pdf { background: #7c3aed; }
    .btn-pdf:hover { background: #5b21b6; }

    textarea {
      width: 100%;
      height: 420px;
      margin-top: 20px;
      padding: 15px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <img src="logo-oasisturdf.png" alt="Oasis Tour DF">
    </div>

    <h1>Gerador de Proposta ANADEM</h1>
    <p class="subtitle">Ferramenta exclusiva • OASIS TOUR DF</p>

    <label>Grupo / Especialidade</label>
    <input id="p1" placeholder="Ex: D1 – Odontologia">

    <label>Capital Segurado</label>
    <input id="p2" placeholder="Ex: R$ 500.000,00">

    <label>Cartão – Tabela Verde</label>
    <input id="p3" placeholder="Ex: R$ 189,00">

    <label>Boleto – Tabela Verde</label>
    <input id="p4" placeholder="Ex: R$ 199,00">

    <label>Cartão – Tabela Black</label>
    <input id="p5" placeholder="Ex: R$ 239,00">

    <label>Boleto – Tabela Black</label>
    <input id="p6" placeholder="Ex: R$ 249,00">

    <button class="btn-gerar" onclick="gerarTexto()">Gerar proposta</button>
    <button class="btn-copiar" onclick="copiarTexto()">Copiar texto</button>
    <button class="btn-pdf" onclick="gerarPDF()">Gerar Proposta em PDF</button>
    <button class="btn-limpar" onclick="limparCampos()">Limpar campos</button>

    <textarea id="resultado" placeholder="O texto final aparecerá aqui..."></textarea>

    <footer>
      © OASIS TOUR DF • Ferramenta interna de uso comercial
    </footer>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
function gerarTexto() {
  const p1 = document.getElementById("p1").value;
  const p2 = document.getElementById("p2").value;
  const p3 = document.getElementById("p3").value;
  const p4 = document.getElementById("p4").value;
  const p5 = document.getElementById("p5").value;
  const p6 = document.getElementById("p6").value;

  const texto =
`Proposta Personalizada – ANADEM
Proteção Jurídica Completa para Profissionais da Saúde

Especialidade: ${p1}
Capital Segurado: R$ ${p2}

SEM Retroatividade
Cartão: R$ ${p3}/mês
Boleto: R$ ${p4}/mês

COM Retroatividade 5 anos (Recomendado)
Cartão: R$ ${p5}/mês
Boleto: R$ ${p6}/mês

Doutor(a), pensando na sua especialidade (${p1}), a ANADEM possui uma proposta sob medida para garantir sua tranquilidade profissional em um cenário de crescente judicialização. Hoje em dia, qualquer procedimento pode virar um processo — mesmo quando tudo é feito corretamente, e a ANADEM atua para que nenhuma situação dessa ocorra sem o devido suporte.

Diferenciais ANADEM:
• A retroatividade protege também, atos já realizados nos últimos 5 anos (conforme rege o regulamento).
• Atuação jurídica preventiva e defesa completa, com advogado indicado e custeado pela ANADEM — sem desembolso inicial e sem reembolso posterior
• Suporte jurídico especializado para qualquer situação relacionada à sua atividade profissional, 24h por dia.
• Processos ilimitados, sem franquia para Plano Pessoa Física
• Cobertura nacional

Vantagens Exclusivas ANADEM
• Gerenciamento de crise de imagem e reputação on-line. Proteção no Google, redes sociais e mídias digitais. Nenhum outro produto fornece este serviço.
• Extensão gratuita para CNPJ, quando houver consultório, com um sócio da área da saúde, e não tenha leitos/internação ou para CNPJ de faturamento.

IMPORTANTE

A defesa correta desde o início faz toda a diferença.
Podemos ativar sua proteção hoje mesmo.

Fico à disposição!`;

  document.getElementById("resultado").value = texto;
}

function copiarTexto() {
  const campo = document.getElementById("resultado");
  campo.select();
  campo.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Pode mandar pro médico!");
}

function limparCampos() {
  document.getElementById("p1").value = "";
  document.getElementById("p2").value = "";
  document.getElementById("p3").value = "";
  document.getElementById("p4").value = "";
  document.getElementById("p5").value = "";
  document.getElementById("p6").value = "";
  document.getElementById("resultado").value = "";
}

function getBase64ImageFromURL(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.setAttribute('crossOrigin', 'anonymous');
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = error => reject(error);
    img.src = url;
  });
}

async function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const texto = document.getElementById("resultado").value || "Gere a proposta antes de criar o PDF.";

  try {
    const logoBase64 = await getBase64ImageFromURL('logo-oasisturdf.png');
    doc.addImage(logoBase64, 'PNG', 70, 10, 70, 25);
  } catch(e) {}

  doc.setFont('Helvetica', 'Bold');
  doc.setFontSize(16);
  doc.text('PROPOSTA COMERCIAL', 105, 45, { align: 'center' });

  doc.setFont('Helvetica', 'Normal');
  doc.setFontSize(11);

  const textoCompleto = texto +

`\n\n------------------------------------
Higo Gerson C. de Amorim
Representante Comercial
GRUPO OASIS DF`;

  const linhas = doc.splitTextToSize(textoCompleto, 180);

  doc.text(linhas, 15, 60);

  doc.save('Proposta_ANADEM_OASIS.pdf');
}
</script>

</body>
</html>

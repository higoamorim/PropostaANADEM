<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Proposta | OASIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f8; margin: 0; padding: 0; }
    .container { max-width: 900px; margin: auto; background: #ffffff; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-radius: 12px; margin-top: 40px; margin-bottom: 40px; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { max-width: 220px; }
    h1 { text-align: center; margin-bottom: 10px; }
    p.subtitle { text-align: center; color: #555; margin-bottom: 30px; }
    label { font-weight: bold; margin-top: 15px; display: block; }
    input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; color: #fff; font-weight: bold; transition: 0.3s; }
    .btn-gerar { background: #0f766e; grid-column: span 2; }
    .btn-copiar { background: #2563eb; }
    .btn-pdf { background: #1e40af; }
    .btn-limpar { background: #6b7280; grid-column: span 2; }
    button:hover { opacity: 0.9; }
    textarea { width: 100%; height: 350px; margin-top: 20px; padding: 15px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; resize: vertical; box-sizing: border-box; }
    footer { text-align: center; font-size: 13px; color: #777; margin-top: 25px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="logo-oasisturdf.png" alt="Oasis Tour DF">
    </div>

    <h1>Gerador de Proposta ANADEM</h1>
    <p class="subtitle">Ferramenta Comercial • GRUPO OASIS DF</p>

    <label>Nome do Médico(a)</label>
    <input id="pNome" placeholder="Ex: Dr. Fulano de Tal">

    <label>Telefone / WhatsApp</label>
    <input id="pTel" placeholder="Ex: (61) 99999-9999">

    <label>Grupo / Especialidade</label>
    <input id="p1" placeholder="Ex: D1 – Odontologia">

    <label>Capital Segurado</label>
    <input id="p2" placeholder="Ex: 500.000,00">

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Blue (Somente Medicina)</label>
        <input id="p7" placeholder="R$ 159,00">
      </div>
      <div style="flex: 1;"></div>
    </div>

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Verde</label>
        <input id="p3" placeholder="R$ 189,00">
      </div>
      <div style="flex: 1;">
        <label>Boleto – Tabela Verde</label>
        <input id="p4" placeholder="R$ 199,00">
      </div>
    </div>

    <div style="display: flex; gap: 20px;">
      <div style="flex: 1;">
        <label>Cartão – Tabela Black</label>
        <input id="p5" placeholder="R$ 239,00">
      </div>
      <div style="flex: 1;">
        <label>Boleto – Tabela Black</label>
        <input id="p6" placeholder="R$ 249,00">
      </div>
    </div>

    <div class="grid-btns">
        <button class="btn-gerar" onclick="gerarTexto()">1. Gerar Texto Original</button>
        <button class="btn-copiar" onclick="copiarTexto()">2. Copiar p/ WhatsApp</button>
        <button class="btn-pdf" onclick="gerarPDF()">3. Gerar PDF (2 Páginas)</button>
        <button class="btn-limpar" onclick="limparCampos()">Limpar Formulário</button>
    </div>

    <textarea id="resultado" placeholder="O texto original será gerado aqui..."></textarea>
    <footer>© OASIS TOUR DF</footer>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>

function gerarTexto() {
  const nome = document.getElementById("pNome").value || "Doutor(a)";
  const tel = document.getElementById("pTel").value || "Não informado";
  const p5 = document.getElementById("p5").value || "VALOR CARTÃO";
  const p6 = document.getElementById("p6").value || "VALOR BOLETO";
  const p1 = document.getElementById("p1").value || "Especialidade";

  const texto = `Prezado(a) Dr. ${nome},

Conforme conversamos, realizei a análise do seu perfil.
Para a seu Grupo/Especialidade: ${p1} , o plano ideal para garantir a sua total segurança jurídica é a *Blindagem ANADEM com cobertura retroativa completa*.

O investimento para a sua proteção integral é de *R$ ${p6} mensais no Boleto*.

A contratação é feita online. Vou te enviar o link do formulário de Adesão para preenchimento.
Leva menos de 5 minutos.

`;

  document.getElementById("resultado").value = texto;
}


function copiarTexto() {
  const campo = document.getElementById("resultado");
  if (!campo.value) return;
  campo.select();
  document.execCommand("copy");
  alert("Copiado com sucesso!");
}

function limparCampos() {
  ["pNome","pTel","p1","p2","p3","p4","p5","p6","p7","resultado"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = "";
  });
}

async function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const margemEsquerda = 15;
  const larguraUtil = 180;
  const limiteInferior = 270; // Área segura antes do rodapé

  // Captura de Dados
  const nomeMed = document.getElementById("pNome").value || "---";
  const telMed = document.getElementById("pTel").value || "---";
  const p1 = document.getElementById("p1").value || "---";
  const p2 = document.getElementById("p2").value || "---";
  const p3 = document.getElementById("p3").value || "---";
  const p4 = document.getElementById("p4").value || "---";
  const p5 = document.getElementById("p5").value || "---";
  const p6 = document.getElementById("p6").value || "---";
  const p7 = document.getElementById("p7").value || "---";

  // --- PÁGINA 1: Cabeçalho e Tabela ---
  doc.setFillColor(30, 64, 175);
  doc.rect(0, 0, 210, 38, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(22);
  doc.setFont('Helvetica', 'Bold');
  doc.text('PROPOSTA COMERCIAL ANADEM', 105, 18, { align: 'center' });
  doc.setFontSize(14);
  doc.text('Blindagem Profissional ANADEM', 105, 30, { align: 'center' });

  doc.setTextColor(0, 0, 0);
  doc.setFontSize(11);
  doc.text(`Doutor(a): ${nomeMed}`, margemEsquerda, 48);
  doc.text(`Contato: ${telMed}`, margemEsquerda, 54);
  doc.text(`Especialidade: ${p1}`, margemEsquerda, 60);
  doc.text(`Capital Segurado*: R$ ${p2}`, margemEsquerda, 67);

  doc.autoTable({
    startY: 74,
    head: [['Modalidade de Cobertura', 'Cartão de Crédito Mensal', 'Boleto Bancário Mensal']],
    body: [
      ['ANADEM BLUE (Apólice R$ 300 mil/Somente Cartão)', `R$ ${p7}`, '---'],
      ['Tabela Verde (Sem Retroatividade)', `R$ ${p3}`, `R$ ${p4}`],
      ['Tabela Black (Retroatividade 5 anos)', `R$ ${p5}`, `R$ ${p6}`]
    ],
    theme: 'grid',
    headStyles: { fillColor: [30, 64, 175] }
  });

  let y = doc.lastAutoTable.finalY + 12;

  // Função Auxiliar para Escrever com Quebra de Página Automática
  const escreverLista = (titulo, itens, corTitulo = [0,0,0]) => {
    if (y > limiteInferior - 20) { doc.addPage(); y = 20; }
    
    doc.setFont('Helvetica', 'Bold');
    doc.setFontSize(12);
    doc.setTextColor(corTitulo[0], corTitulo[1], corTitulo[2]);
    doc.text(titulo, margemEsquerda, y);
    y += 8;

    doc.setFont('Helvetica', 'Normal');
    doc.setFontSize(11);
    doc.setTextColor(0, 0, 0);

    itens.forEach(item => {
      const linhas = doc.splitTextToSize(item, larguraUtil);
      const alturaNecessaria = linhas.length * 5;

      if (y + alturaNecessaria > limiteInferior) {
        doc.addPage();
        y = 15;
      }

      doc.text(linhas, margemEsquerda, y);
      y += alturaNecessaria + 1;
    });
  };

  // Seção 1: Diferenciais
  const diferenciais = [
" ",
    "• Assistência jurídica especializada em Direito Médico e Odontológico, nas áreas Criminal, Cível, Administrativa e Ética - CRM/CFM e CRO/CFO, por meio de renomados escritórios de advocacia credenciados em todo o território nacional.",
    "• Plantão permanente para esclarecer dúvidas, encaminhar o cliente ao escritório de advocacia credenciado a Anadem e oferecer suporte em caso de recebimento de intimação, notificação ou citação em âmbito judicial ou extrajudicial.",
    "• Ressarcimento de atos médicos/odontológicos praticados após a data de deferimento da adesão. Na contratação pela Tabela Black, haverá cobertura retroativa de 5 (cinco) anos para o ato profissional. Caso a pessoa física tenha apólice de seguro de Responsabilidade Civil Profissional vigente em Sociedade Seguradora, será mantida a data da retroatividade de cobertura dessa referida apólice, sem cobrança de contribuição adicional, limitada a 5 (cinco) anos, e desde que não tenha havido qualquer interrupção de vigência de seguro. Em ambos os casos, a retroatividade para o ato profissional será contada, e somente haverá cobertura para o processo protocolizado a partir do deferimento da adesão na condição de cliente.",
    "• Indenização financeira de até R$ 1.000.000,00 (um milhão de reais), de acordo com o plano contratado*.",
    "• Extensão Gratuita ao CNPJ (consulte condições no atendimento)",
    "• Cobertura para danos corporais, materiais, morais, estéticos e existenciais.",
    "• Cobertura de honorários de peritos e de assistente técnicos.",
    "• Gerenciamento de Crise de Imagem e Redes Sociais",
    "• Sem sub-limitação de cobertura",
    "• Sem limite de processos",
    "• Antecipação de Tutela",
    "• Sem denunciação à lide",
    "• Renovação automática",
    "• Cobertura Nacional",
    "• Sem limite de cobertura (Plano pessoa física).",
     " ",
    " DIFERENCIAIS EXCLUSIVOS DO PRODUTO ANADEM - TABELA BLACK E TABELA VERDE",
    " ",
    "• A retroatividade (Tabela Black) protege também, atos já realizados nos últimos 5 anos (conforme rege o regulamento).",
    "• Atuação jurídica preventiva e defesa completa, com advogado indicado e custeado pela ANADEM - sem desembolso inicial e sem reembolso posterior.",
    "• Suporte jurídico especializado para qualquer situação relacionada à sua atividade profissional, 24h por dia.",
    "• Processos ilimitados, sem franquia para Plano Pessoa Física.",
    "• Sem carência (Salvos casos específicos vide atendimento).",
    "• Cobertura nacional.",
    "• Gerenciamento de crise de imagem e reputação on-line.",
    "• Proteção no Google, redes sociais e mídias digitais.",
    "• Extensão gratuita para o CNPJ (desde que para fins de faturamento, sem leito/internação e que haja somente um sócio da área da saúde no contrato social).",
    "• A ANADEM também possui as formas de pagamento Anual em 4x, e não compromete seu limite: As parcelas são deduzidas mensalmente, preservando o crédito do seu cartão para outras necessidades.",
    "• Opção Anual à vista: Com quitação imediata do período.",

  ];
  escreverLista("DIFERENCIAIS E VANTAGENS EXCLUSIVAS - ANADEM", diferenciais);

// Apenas um espaço extra em vez de uma nova página
y += 10;

  // Seção 2: Regras Blue
  const regrasBlue = [
    "• Os valores para pagamento constantes da tabela comercial deste produto (Anadem Blue) serão aplicáveis para médicos sem histórico de processos e/ou com expectativa de reclamações.",
    "• Médicos com histórico de processos poderão optar pelos produtos das tabelas Verde ou Black.",
    "• Esta modalidade de plano não contempla o benefício da cobertura retroativa de 5 (cinco) anos para o ato profissional e está disponível somente na modalidade de pagamento mensal e em cartão de crédito.",
    "• Não haverá assistência jurídica pelo escritório de advocacia credenciado nem cobertura securitária pela seguradora contratada, às denúncias e aos processos protocolados antes da adesão do cliente, bem como reclamações cujo fato gerador também tenham ocorrido anteriormente a data de adesão do cliente à Anadem.",
    "• Não haverá cobertura para antecipação de tutela.",
    "• A cobertura para honorários periciais será de até uma vez o limite máximo da tabela da Associação Médica Brasileira (Tabela AMB-2013), e de até 50% do limite da referida tabela para os honorários do assistente técnico, aplicável nos processos cíveis indenizatórios ao qual o cliente venha a responder, decorrente de ato profissional por ele praticado, cujos riscos estejam cobertos pela Anadem e, desde que ambas as despesas processuais, por processo, sejam, previamente, autorizadas pela Diretoria Jurídica da Anadem.",
    "• A cobertura da Pessoa Jurídica estará restrita a procedimento do profissional de saúde realizado em Instituições que não possuam leitos e desde que o procedimento médico não necessite de internação.",
    "• A cobertura da Pessoa Jurídica estará vinculada exclusivamente ao ato profissional da Pessoa Física correspondente, independentemente da quantidade de sócios, de figurar (ou não) como sócio e da classificação da sociedade civil ou comercial.",
    "• A aceitação ou não da proposta de extensão da Pessoa Jurídica será analisada pelo Setor de Adesões da ANADEM.",
    "• A cobertura da Pessoa Jurídica estará restrita às empresas para fins de faturamento.",
    "• Este produto (Anadem Blue) não possui condição comercial para residentes de medicina.",
    "• Essa modalidade de contratação está disponível somente para as especialidades de Medicina.",

];



  escreverLista("REGRAS ESPECÍFICAS: PRODUTO ANADEM BLUE", regrasBlue, [30, 64, 175]);



// Rodapé: Distribuído verticalmente para não sobrepor
doc.setFont('Helvetica', 'Bold');
doc.setFontSize(8);

// Linha 1
doc.text('Higo Gerson C. de Amorim - Representante Comercial ANADEM', 105, 275, { align: 'center' });

// Linha 2 (+4 unidades abaixo)
doc.text('grupo.oasisdf@gmail.com | 61 99314-4931 | 61 99630-0538', 105, 279, { align: 'center' });

// Linha 3 (+4 unidades abaixo)
doc.text('2026 - Grupo OASIS DF', 105, 283, { align: 'center' });
  doc.save(`Orcamento_ANADEM_${nomeMed.replace(/\s+/g, '_')}.pdf`);

}
</script>
</body>
</html>
